<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#182c32"><title>Yellow Journey — Touch Fix v0.2</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#172b31;color:white;font-family:system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}#hud{position:absolute;top:env(safe-area-inset-top);left:0;right:0;padding:12px 16px;pointer-events:none;text-shadow:1px 2px #172b31}#hud b{font-size:15px;letter-spacing:.08em}#hud small{display:block;font-size:11px;opacity:.85}#pad{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));left:18px;display:grid;grid-template-columns:repeat(3,53px);grid-template-rows:repeat(3,53px);gap:3px;user-select:none}button{touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;appearance:none;-webkit-appearance:none;border:2px solid #b9d4c8;background:#203d46d9;color:white;border-radius:13px;font-size:23px;font-weight:800;box-shadow:0 4px #10232c}button:active,.held{background:#62917e}#up{grid-column:2;grid-row:1}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:3}#right{grid-column:3;grid-row:2}#act{position:absolute;right:23px;bottom:calc(42px + env(safe-area-inset-bottom));width:75px;height:75px;border-radius:50%;background:#bb663cdb}#dialog{display:none;position:absolute;left:12px;right:12px;bottom:calc(190px + env(safe-area-inset-bottom));background:#f4e8cb;color:#263c3d;border:4px solid #2d4d50;border-radius:8px;padding:13px 15px;font-size:15px;line-height:1.4;box-shadow:0 5px #132b2b}#hint{position:absolute;right:13px;top:calc(14px + env(safe-area-inset-top));font-size:11px;opacity:.8;pointer-events:none}#start{position:absolute;inset:0;background:#172b31ef;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center}#start section{max-width:340px}#start h1{font-size:30px;line-height:1.1;color:#f5d66e}#start p{line-height:1.55}#start button{padding:12px 30px;font-size:17px;background:#b35f38}</style></head><body><canvas id="game"></canvas><div id="hud"><b>YELLOW JOURNEY</b><small>PALLET-INSPIRED VILLAGE · ENGINE PROTOTYPE</small></div><div id="hint">MOVE: D-PAD / WASD · TALK: A / SPACE</div><div id="pad"><button id="up" aria-label="Up">▲</button><button id="left" aria-label="Left">◀</button><button id="right" aria-label="Right">▶</button><button id="down" aria-label="Down">▼</button></div><button id="act">A</button><div id="dialog"></div><div id="start"><section><h1>YELLOW JOURNEY</h1><p>A tiny 2.5D monster-adventure engine prototype.<br>Explore the village, talk to the researcher, and meet your little companion.</p><button id="play">PLAY PROTOTYPE</button><p style="font-size:12px;opacity:.7">Original temporary art · works offline after saving</p></section></div><script>
(()=>{'use strict';const c=document.getElementById('game'),g=c.getContext('2d'),T=32,W=24,H=19;let vw=0,vh=0,scale=1,camX=0,camY=0,last=0,started=false,dialog=false;const keys=new Set(),player={x:11.5,y:13.5,dir:'down',step:0},buddy={x:11.5,y:14.6,step:0},trail=[];const map=Array.from({length:H},(_,y)=>Array.from({length:W},(_,x)=>x===0||y===0||x===W-1||y===H-1?'f':'g'));function rect(x,y,w,h,t){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)if(map[j]?.[i])map[j][i]=t}rect(0,0,24,2,'f');rect(1,3,22,1,'f');rect(1,16,22,2,'f');rect(2,4,4,3,'b');rect(10,4,5,4,'b');rect(18,4,4,3,'b');rect(4,10,4,4,'b');rect(16,10,5,4,'b');rect(8,2,2,14,'p');rect(9,8,8,2,'p');rect(8,12,9,2,'p');rect(11,9,2,8,'p');rect(1,8,5,1,'p');rect(17,8,6,1,'p');rect(1,14,4,1,'p');const buildings=[{x:2,y:4,w:4,h:3,roof:'#d46b60',label:'HOME'},{x:10,y:4,w:5,h:4,roof:'#577ea7',label:'LAB'},{x:18,y:4,w:4,h:3,roof:'#cf9b55',label:'SHOP'},{x:4,y:10,w:4,h:4,roof:'#a66c9b',label:'HOUSE'},{x:16,y:10,w:5,h:4,roof:'#7aab7a',label:'INN'}];const npcs=[{x:12.5,y:8.55,shirt:'#e7e2dc',name:'RESEARCHER',text:'Welcome! This is our first 2.5D engine test. The village, camera, collisions, and companion-following all work.'},{x:6.5,y:8.5,shirt:'#e0a74f',name:'VILLAGER',text:'Those houses have raised walls and roofs, just like a classic 2.5D adventure. Try walking around them!'},{x:18.5,y:15.5,shirt:'#ad75b0',name:'TRAVELER',text:'Next we can add real maps, animated battles, menus, and a save system.'}];function resize(){vw=innerWidth;vh=innerHeight;const d=Math.min(devicePixelRatio||1,2);c.width=Math.round(vw*d);c.height=Math.round(vh*d);g.setTransform(d,0,0,d,0,0);g.imageSmoothingEnabled=false;scale=Math.max(1.45,Math.min(vw/290,vh/460,2.65))}addEventListener('resize',resize);resize();function tile(x,y){return map[Math.floor(y)]?.[Math.floor(x)]||'f'}function free(x,y){const r=.23;for(const [a,b] of [[-r,-r],[r,-r],[-r,r],[r,r]])if(['b','f'].includes(tile(x+a,y+b)))return false;return !npcs.some(n=>Math.hypot(x-n.x,y-n.y)<.57)}function box(x,y,w,h,color){g.fillStyle=color;g.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h))}function world(x,y){return [Math.round((x*T-camX)*scale+vw/2),Math.round((y*T-camY)*scale+vh*.48)]}function block(x,y,w,h,color){const [a,b]=world(x,y);box(a,b,w*scale,h*scale,color)}function drawTile(x,y,t){const [a,b]=world(x,y),s=T*scale;box(a,b,s+1,s+1,t==='p'?'#d4c49b':t==='f'?'#325d4b':'#79aa6a');let hash=(x*92821+y*68917)%11;if(t==='g'){box(a+(hash%5+2)*s/9,b+(hash%4+2)*s/8,2*scale,5*scale,'#4e925e');if(hash===2)box(a+s*.65,b+s*.3,3*scale,3*scale,'#f5d478')}if(t==='p'){box(a+2*scale,b+3*scale,4*scale,2*scale,'#c2b48f');box(a+s*.65,b+s*.7,3*scale,2*scale,'#b9aa83')}if(t==='f'){box(a+s*.25,b+s*.25,s*.5,s*.5,'#417c5d')}}function house(h){let [x,y]=world(h.x,h.y),s=scale,ww=h.w*T*s,hh=h.h*T*s;box(x+7*s,y+7*s,ww,hh,'#4d665f');box(x+4*s,y-15*s,ww,hh-3*s,'#f1d9a9');box(x+4*s,y+hh-35*s,ww,32*s,'#d2b687');box(x+ww*.44,y+hh-34*s,ww*.16,31*s,'#694f48');box(x+ww*.14,y+hh-44*s,ww*.17,13*s,'#6b9eb0');box(x+ww*.69,y+hh-44*s,ww*.17,13*s,'#6b9eb0');box(x-4*s,y-29*s,ww+16*s,22*s,h.roof);box(x+4*s,y-7*s,ww,8*s,'#7a4d56');for(let i=0;i<Math.floor(h.w*2);i++)box(x+i*ww/(h.w*2)+2*s,y-27*s,3*s,3*s,'#ffffff28');g.fillStyle='#fff3cf';g.font=`bold ${Math.round(7*s)}px monospace`;g.textAlign='center';g.fillText(h.label,x+ww/2,y-12*s)}function human(x,y,shirt,walking=0){const [a,b]=world(x,y),s=scale,ox=a-8*s,oy=b-23*s;box(ox+3*s,oy+19*s,5*s,5*s,'#30445b');box(ox+10*s,oy+19*s,5*s,5*s,'#30445b');box(ox+2*s,oy+10*s,14*s,10*s,shirt);box(ox,oy+12*s,3*s,8*s,'#e5b98a');box(ox+15*s,oy+12*s,3*s,8*s,'#e5b98a');box(ox+4*s,oy+2*s,11*s,10*s,'#edc69b');box(ox+3*s,oy,13*s,5*s,'#3c3639');box(ox+5*s,oy+7*s,2*s,2*s,'#302e35');box(ox+12*s,oy+7*s,2*s,2*s,'#302e35');if(walking>0)box(ox+4*s,oy+23*s,4*s,2*s,'#172c38')}function hero(){human(player.x,player.y,'#3b78a1',Math.sin(player.step*10)>0?1:0);const [a,b]=world(player.x,player.y),s=scale;box(a-8*s,b-26*s,16*s,4*s,'#c84e48');box(a-10*s,b-23*s,18*s,3*s,'#e56b5c');box(a+5*s,b-16*s,3*s,3*s,'#e9e2c6')}function companion(){const [a,b]=world(buddy.x,buddy.y),s=scale;box(a-8*s,b-15*s,16*s,13*s,'#e9c84c');box(a-7*s,b-24*s,5*s,12*s,'#e8c64a');box(a+3*s,b-24*s,5*s,12*s,'#e8c64a');box(a-7*s,b-24*s,5*s,4*s,'#3d4441');box(a+3*s,b-24*s,5*s,4*s,'#3d4441');box(a-5*s,b-10*s,3*s,3*s,'#3c3932');box(a+3*s,b-10*s,3*s,3*s,'#3c3932');box(a-8*s,b-6*s,4*s,4*s,'#d56c55');box(a+5*s,b-6*s,4*s,4*s,'#d56c55');box(a+8*s,b-15*s,4*s,5*s,'#aa7646');box(a+11*s,b-20*s,4*s,5*s,'#aa7646')}function tree(x,y){const [a,b]=world(x,y),s=scale;box(a-3*s,b-17*s,7*s,18*s,'#775e46');box(a-13*s,b-31*s,27*s,21*s,'#2b6c50');box(a-9*s,b-37*s,20*s,15*s,'#448b5b');box(a-5*s,b-35*s,7*s,4*s,'#66a96c')}function nearNpc(){return npcs.find(n=>Math.hypot(n.x-player.x,n.y-player.y)<1.7)}function action(){if(dialog){dialog=false;document.getElementById('dialog').style.display='none';return}let n=nearNpc();let text=n?`${n.name}: ${n.text}`:'Your little companion looks happy to be exploring with you!';document.getElementById('dialog').textContent=text;document.getElementById('dialog').style.display='block';dialog=true}function update(dt){if(!started||dialog)return;let dx=(keys.has('right')?1:0)-(keys.has('left')?1:0),dy=(keys.has('down')?1:0)-(keys.has('up')?1:0);if(dx||dy){const m=Math.hypot(dx,dy);dx/=m;dy/=m;const sp=3.15*dt;if(free(player.x+dx*sp,player.y))player.x+=dx*sp;if(free(player.x,player.y+dy*sp))player.y+=dy*sp;player.step+=dt;player.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');trail.unshift({x:player.x,y:player.y});if(trail.length>80)trail.pop()}let target=trail[Math.min(22,trail.length-1)]||{x:player.x,y:player.y+1};let d=Math.hypot(target.x-buddy.x,target.y-buddy.y);if(d>.12){let amt=Math.min(d,3.6*dt);buddy.x+=(target.x-buddy.x)/d*amt;buddy.y+=(target.y-buddy.y)/d*amt}}function draw(){g.fillStyle='#244b44';g.fillRect(0,0,vw,vh);camX=player.x*T;camY=player.y*T;let x0=Math.max(0,Math.floor((camX-vw/(2*scale))/T)-1),x1=Math.min(W,Math.ceil((camX+vw/(2*scale))/T)+1),y0=Math.max(0,Math.floor((camY-vh*.48/scale)/T)-2),y1=Math.min(H,Math.ceil((camY+vh*.52/scale)/T)+2);for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++)drawTile(x,y,map[y][x]);const objects=[...buildings.map(h=>({sort:h.y+h.h,draw:()=>house(h)})),...npcs.map(n=>({sort:n.y,draw:()=>human(n.x,n.y,n.shirt)})),{sort:player.y,draw:hero},{sort:buddy.y,draw:companion}];for(let x=1;x<23;x+=3){objects.push({sort:1.7,draw:()=>tree(x,1.7)});objects.push({sort:17.8,draw:()=>tree(x,17.8)})}objects.sort((a,b)=>a.sort-b.sort);for(const o of objects)o.draw();if(nearNpc()&&!dialog){let [a,b]=world(player.x,player.y-1);g.fillStyle='#fff6ce';g.font=`bold ${12*scale}px monospace`;g.textAlign='center';g.fillText('!',a,b)}}function frame(t){const dt=Math.min((t-last)/1000||0,.04);last=t;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('selectstart',e=>e.preventDefault());document.addEventListener('dragstart',e=>e.preventDefault());document.addEventListener('touchmove',e=>{if(e.cancelable)e.preventDefault()},{passive:false});for(const id of ['up','down','left','right']){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(id);b.classList.add('held')});const stop=e=>{keys.delete(id);b.classList.remove('held')};b.addEventListener('pointerup',stop);b.addEventListener('pointerleave',e=>{if(!b.hasPointerCapture(e.pointerId))stop(e)});b.addEventListener('pointercancel',stop);b.addEventListener('lostpointercapture',stop)}addEventListener('blur',()=>keys.clear());document.getElementById('act').addEventListener('pointerdown',e=>{e.preventDefault();action()});addEventListener('keydown',e=>{const k={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'}[e.code];if(k){keys.add(k);e.preventDefault()}if(e.code==='Space'||e.code==='Enter'){if(!e.repeat)action();e.preventDefault()}});addEventListener('keyup',e=>{const k={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'}[e.code];if(k)keys.delete(k)});document.getElementById('play').addEventListener('click',()=>{started=true;document.getElementById('start').remove()})})();
</script></body></html>
